name: Update latest posts

# Pulls the newest posts from vibewithadam.matthewsteinberger.com's RSS feed
# into README.md between the BLOG-POST-LIST markers.
#
# develop and main are protected: no force-push, linear history, and every
# change must arrive as a pull request. Only the repo admin bypasses that, so
# this workflow does not push to develop. It pushes a branch — which the
# ruleset does not cover — then opens a PR and squash-merges it with the
# built-in GITHUB_TOKEN. No deploy key and no bypass actor required.

on:
  schedule:
    - cron: "0 13 * * 1,4" # Mon + Thu, 09:00 US Eastern (13:00 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-latest-posts
  cancel-in-progress: true

env:
  # How many posts end up in the README after filtering.
  POSTS_SHOWN: "4"
  # Comma-separated URL slugs to keep off the hiring profile. These posts stay
  # published on the site and in the RSS feed — they just aren't the first thing
  # a hiring manager reads here.
  EXCLUDED_POST_SLUGS: "why-im-leaving-a-job-i-liked"
  BRANCH: automation/update-latest-posts

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest posts into README (no commit)
        # gautamkrishnar/blog-post-workflow v1 / 1.9.7
        uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b
        with:
          feed_list: "https://vibewithadam.matthewsteinberger.com/feed.xml"
          # Over-fetch so the list is still full after the exclusions below.
          max_post_count: 10
          readme_path: ./README.md
          template: "- [$title]($url) — $date$newline"
          date_format: "mmm d, yyyy"
          skip_commit: "true"

      - name: Apply exclusions and trim the list
        run: python3 .github/scripts/filter_posts.py

      - name: Open a PR and merge it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- README.md; then
            echo "README unchanged; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add README.md
          git commit -m "chore(readme): update latest posts"
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          # Reuse an open PR if a previous run left one behind.
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')" ]; then
            gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "$BRANCH" \
              --title "chore(readme): update latest posts" \
              --body "Automated refresh of the BLOG-POST-LIST block from the site's RSS feed."
          fi

          # Squash keeps the linear history the ruleset requires.
          gh pr merge "$BRANCH" --squash --delete-branch
